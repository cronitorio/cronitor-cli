services:
  crontab-guru:
    build:
      context: .
      dockerfile: dockerfile
    environment:
      CRONITOR_DASH_USER: ${CRONITOR_DASH_USER:?Set CRONITOR_DASH_USER}
      CRONITOR_DASH_PASS: ${CRONITOR_DASH_PASS:?Set CRONITOR_DASH_PASS}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - cronitor-config:/etc/cronitor
      - crontabs:/var/spool/cron/crontabs
    restart: unless-stopped

volumes:
  cronitor-config:
  crontabs:
