name: "CronitorCLI Release"

on:
  push:
    tags:
      - '*'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-binaries:
    name: Create build assets
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        goos: [linux, windows, darwin, freebsd]
        goarch: [amd64, arm, arm64]
        exclude:
          - goarch: arm
            goos: darwin
          - goarch: arm
            goos: windows
          - goarch: arm64
            goos: windows

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        run: |
          cd web
          npm install

      - name: Ensure static directory exists
        run: |
          mkdir -p web/static
          ls -la web/

      - name: Build web assets
        run: |
          cd web
          echo "Starting web build..."
          npm run build
          echo "Web build completed"

      - name: Verify web assets were built
        run: |
          test -s web/static/index.html

      - name: Go Release Binaries Normal Volume Size
        uses: wangyoucao577/go-release-action@v1.53
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          asset_name: ${{ matrix.goos }}_${{ matrix.goarch }}
          goversion: '${{ github.workspace }}/go.mod'
          binary_name: cronitor
          sha256sum: true
          overwrite: true
          # Stage assets in Actions; do not expose an incomplete GitHub release.
          upload: false
          pre_command: export CGO_ENABLED=0

      - name: Generate checksums
        env:
          ASSET_PREFIX: ${{ matrix.goos }}_${{ matrix.goarch }}
          TARGET_OS: ${{ matrix.goos }}
        run: |
          extension=tar.gz
          if [ "$TARGET_OS" = windows ]; then extension=zip; fi
          archive="$ASSET_PREFIX.$extension"
          test -s "$archive"
          sha256sum "$archive" | cut -d ' ' -f 1 > "$archive.sha256"
          md5sum "$archive" | cut -d ' ' -f 1 > "$archive.md5"

      - name: Stage release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}_${{ matrix.goarch }}
          path: ${{ matrix.goos }}_${{ matrix.goarch }}.*
          if-no-files-found: error

  publish:
    name: Publish complete release
    runs-on: ubuntu-latest
    needs: [build-binaries]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete asset set and checksums
        working-directory: release-assets
        run: |
          for target in linux_amd64 linux_arm linux_arm64 darwin_amd64 darwin_arm64 freebsd_amd64 freebsd_arm freebsd_arm64 windows_amd64; do
            extension=tar.gz
            if [ "$target" = windows_amd64 ]; then extension=zip; fi
            archive="$target.$extension"
            test -s "$archive"
            test -s "$archive.sha256"
            test -s "$archive.md5"
            printf '%s  %s\n' "$(cat "$archive.sha256")" "$archive" | sha256sum --check --strict
            printf '%s  %s\n' "$(cat "$archive.md5")" "$archive" | md5sum --check --strict
          done
      - name: Upload to draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "Refusing to overwrite an already published release."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Release $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
